<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoreGo | Administrador</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-page" data-require-role="admin,vendedor" hidden>

<aside class="admin-side">
  <a href="admin.html" class="logo"><span>Store</span>Go</a>
  <a href="admin.html" class="active">Dashboard</a>
  <a href="#" class="disabled" aria-disabled="true">Productos (próximamente)</a>
  <a href="#" class="disabled" aria-disabled="true" data-roles="admin">Usuarios (próximamente)</a>
  <a href="admin-usuario-nuevo.html" data-roles="admin">Nuevo usuario</a>
  <a href="index.html">Ver tienda</a>
  <div class="spacer"></div>
  <a href="#" id="logoutBtn">Cerrar sesión</a>
</aside>

<main class="admin-main">
  <h1>¡HOLA <span data-user-name></span>!</h1>
  <span class="role-badge" data-user-role></span>
  <div class="stat-grid">
    <div class="stat-card"><strong id="statProducts">0</strong><span>Productos en la tienda</span></div>
    <div class="stat-card"><strong id="statUsers">0</strong><span>Usuarios registrados</span></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
