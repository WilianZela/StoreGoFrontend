<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoreGo | Nuevo usuario</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-page" data-require-role="admin" hidden>

<aside class="admin-side">
  <a href="admin.html" class="logo"><span>Store</span>Go</a>
  <a href="admin.html">Dashboard</a>
  <a href="#" class="disabled" aria-disabled="true">Productos (próximamente)</a>
  <a href="#" class="disabled" aria-disabled="true" data-roles="admin">Usuarios (próximamente)</a>
  <a href="admin-usuario-nuevo.html" data-roles="admin" class="active">Nuevo usuario</a>
  <a href="index.html">Ver tienda</a>
  <div class="spacer"></div>
  <a href="#" id="logoutBtn">Cerrar sesión</a>
</aside>

<main class="admin-main">
  <h1>Nuevo usuario</h1>
  <form class="auth-card wide" id="registerForm" novalidate>
    <div class="form-grid">
      <div class="form-field">
        <label for="run">RUN</label>
        <input type="text" id="run" name="run" autocomplete="off">
        <small class="field-hint">Sin puntos ni guion, de 7 a 9 caracteres. Ej: 111111111</small>
        <small class="field-error" id="run-error"></small>
      </div>
      <div class="form-field">
        <label for="fechaNacimiento">Fecha de nacimiento (opcional)</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
        <small class="field-error" id="fechaNacimiento-error"></small>
      </div>
      <div class="form-field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="given-name">
        <small class="field-error" id="nombre-error"></small>
      </div>
      <div class="form-field">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" autocomplete="family-name">
        <small class="field-error" id="apellidos-error"></small>
      </div>
      <div class="form-field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" placeholder="correo@duoc.cl" autocomplete="email">
        <small class="field-hint">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com</small>
        <small class="field-error" id="email-error"></small>
      </div>
      <div class="form-field">
        <label for="emailConfirm">Confirmar correo</label>
        <input type="email" id="emailConfirm" name="emailConfirm" autocomplete="off">
        <small class="field-error" id="emailConfirm-error"></small>
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password">
        <small class="field-hint">Entre 4 y 10 caracteres</small>
        <small class="field-error" id="password-error"></small>
      </div>
      <div class="form-field">
        <label for="passwordConfirm">Confirmar contraseña</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password">
        <small class="field-error" id="passwordConfirm-error"></small>
      </div>
      <div class="form-field">
        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+56912345678">
        <small class="field-error" id="telefono-error"></small>
      </div>
      <div class="form-field full">
        <label for="tipoUsuario">Tipo de usuario</label>
        <select id="tipoUsuario" name="tipoUsuario">
          <option value="">-- Seleccione el tipo --</option>
          <option value="admin">Administrador</option>
          <option value="cliente">Cliente</option>
          <option value="vendedor">Vendedor</option>
        </select>
        <small class="field-error" id="tipoUsuario-error"></small>
      </div>
      <div class="form-field">
        <label for="region">Región</label>
        <select id="region" name="region"></select>
        <small class="field-error" id="region-error"></small>
      </div>
      <div class="form-field">
        <label for="comuna">Comuna</label>
        <select id="comuna" name="comuna"></select>
        <small class="field-error" id="comuna-error"></small>
      </div>
      <div class="form-field full">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" autocomplete="street-address">
        <small class="field-hint">Máximo 300 caracteres</small>
        <small class="field-error" id="direccion-error"></small>
      </div>
    </div>
    <div class="auth-actions">
      <button type="submit" class="btn btn-primary">Registrar</button>
    </div>
  </form>
</main>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
